version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      orleans:
        patterns: ["Microsoft.Orleans.*"]
      aspire:
        patterns: ["Aspire.Hosting.*"]
      crucible:
        patterns: ["Crucible.*"]

  - package-ecosystem: npm
    directory: "/src/Observa.Web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/src/Observa.Web"
    schedule:
      interval: weekly
