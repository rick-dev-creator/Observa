services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: observadb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/Observa.AppHost/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d observadb"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: src/Observa.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__observadb: Host=postgres;Port=5432;Database=observadb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Connectors__Patreon__0__Id: patreon-main
      Connectors__Patreon__0__DisplayName: ${PATREON_DISPLAY_NAME:-Patreon}
      Connectors__Patreon__0__PollInterval: "06:00:00"
      Connectors__Patreon__0__AccessToken: ${PATREON_ACCESS_TOKEN:-}
      Connectors__Blofin__0__Id: blofin-main
      Connectors__Blofin__0__DisplayName: ${BLOFIN_DISPLAY_NAME:-Affiliate}
      Connectors__Blofin__0__PollInterval: "06:00:00"
      Connectors__Blofin__0__ApiKey: ${BLOFIN_API_KEY:-}
      Connectors__Blofin__0__SecretKey: ${BLOFIN_SECRET_KEY:-}
      Connectors__Blofin__0__Passphrase: ${BLOFIN_PASSPHRASE:-}
      Connectors__Solana__0__Id: solana-main
      Connectors__Solana__0__DisplayName: ${SOLANA_DISPLAY_NAME:-Wallet}
      Connectors__Solana__0__PollInterval: "24:00:00"
      Connectors__Solana__0__WalletAddress: ${SOLANA_WALLET_ADDRESS:-}
      Connectors__Solana__0__RpcUrl: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      Connectors__Solana__0__MinValueUsd: ${SOLANA_MIN_VALUE_USD:-10}
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  postgres-data:
